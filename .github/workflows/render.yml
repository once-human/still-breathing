# Free render farm: splits Cycles frames across GitHub runners (up to 20 at once), then commits them to the site.
name: render
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "turntable (web frames, transparent) or stills (presentation front / 3/4 / back)"
        type: choice
        options: [turntable, stills]
        default: turntable
      tees:
        description: "colourways, comma separated"
        default: "black,cream"
      samples:
        description: "Cycles samples per pixel"
        default: "64"

permissions:
  contents: write

env:
  BLENDER: "5.3.0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          tees = [t.strip() for t in "${{ inputs.tees }}".split(",") if t.strip()]
          views = [f"a{a}" for a in range(0, 360, 30)] if "${{ inputs.kind }}" == "turntable" else ["front", "q", "back"]
          print("matrix=" + json.dumps({"include": [{"tee": t, "view": v} for t in tees for v in views]}))
          EOF

  frame:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER }}
      - name: Blender ${{ env.BLENDER }}
        run: |
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender
            curl -sSL "https://download.blender.org/release/Blender${BLENDER%.*}/blender-${BLENDER}-linux-x64.tar.xz" | tar -xJ -C ~/blender --strip-components=1
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 > /dev/null
      - name: Render ${{ matrix.tee }} ${{ matrix.view }}
        run: |
          mkdir -p out
          if [ "${{ inputs.kind }}" = "turntable" ]; then export W=880 H=1120 TRANSPARENT=1; fi
          THREADS=$(nproc) ~/blender/blender -b pipeline/tee-drape.blend -P pipeline/render.py -- B ${{ matrix.tee }} ${{ matrix.view }} "$PWD/out/${{ matrix.tee }}-${{ matrix.view }}.png" ${{ inputs.samples }} | grep -E "Fra:|Saved|Error" | tail -3
          test -s "out/${{ matrix.tee }}-${{ matrix.view }}.png"
      - uses: actions/upload-artifact@v4
        with:
          name: frame-${{ matrix.tee }}-${{ matrix.view }}
          path: out/*.png
          retention-days: 7

  publish:
    needs: frame
    if: always() && needs.frame.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: frames
          pattern: frame-*
          merge-multiple: true
      - name: Place frames and commit
        run: |
          n=0
          for f in frames/*.png; do
            b=$(basename "$f" .png); tee=${b%%-*}; view=${b#*-}
            if [ "${{ inputs.kind }}" = "turntable" ]; then d=public/tee/fred-b-$tee/turntable; mkdir -p $d; cp "$f" $d/$view.png
            else d=previews; mkdir -p $d; cp "$f" $d/3d-B-$tee-$view.png; fi
            n=$((n+1))
          done
          git config user.name "once-human"
          git config user.email "121476278+once-human@users.noreply.github.com"
          git add -A public previews
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Render ${{ inputs.kind }}: $n frames (${{ inputs.tees }}, ${{ inputs.samples }} spp)"
          git push
