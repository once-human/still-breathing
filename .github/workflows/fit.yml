# Fit mode: sews the tee onto five Indian bodies in the three sizes nearest each, moves every body through
# standing, hands up and sitting, and publishes the cloth, the bodies, the fit numbers and the size-aware textures.
name: fit
on:
  workflow_dispatch:
    inputs:
      only:
        description: "limit to these body-size pairs, comma separated (e.g. m170-M); empty = all fifteen"
        default: ""

permissions:
  contents: write

env:
  BLENDER: "5.3.0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          # body: height/chest from Indian adult anthropometry; sizes: the three whose chest ease suits that body
          PLAN = {"m163": ["XS", "S", "M"], "m170": ["S", "M", "L"], "m177": ["L", "XL", "2XL"],
                  "f155": ["XS", "S", "M"], "f162": ["S", "M", "L"]}
          only = [x.strip() for x in "${{ inputs.only }}".split(",") if x.strip()]
          inc = [{"body": b, "size": s, "name": f"{b}-{s}", "form": ""} for b, ss in PLAN.items() for s in ss]
          inc.append({"body": "m170", "size": "M", "name": "form-M", "form": "1"})   # the shop tee, on a ghost form
          # the two people who wear it in the shop view: the athletic man in M, the athletic woman in S
          inc += [{"body": "ma175", "size": "M", "name": "ma175-M", "form": ""}, {"body": "fa163", "size": "S", "name": "fa163-S", "form": ""}]
          inc = [x for x in inc if not only or x["name"] in only]
          print("matrix=" + json.dumps({"include": inc}))
          EOF

  textures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy pillow
      - name: Atlases, per-size construction detail, web maps
        working-directory: pipeline
        run: |
          python3 texture.py A cream; python3 texture.py C black; python3 texture.py D cream
          for s in XS S M L XL 2XL; do SIZE=$s python3 texture.py detail; done
          mkdir -p ../tex && python3 webtex.py ../tex C-black,A-cream,D-cream
          ls -la ../tex
      - uses: actions/upload-artifact@v4
        with: { name: fit-tex, path: tex, retention-days: 7 }

  sim:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      SIZE: ${{ matrix.size }}
      FORM: ${{ matrix.form }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER }}
      - name: Blender ${{ env.BLENDER }}
        run: |
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender
            curl -sSL "https://download.blender.org/release/Blender${BLENDER%.*}/blender-${BLENDER}-linux-x64.tar.xz" | tar -xJ -C ~/blender --strip-components=1
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 > /dev/null
      - name: Sew and move ${{ matrix.name }}
        run: |
          ~/blender/blender -b --factory-startup -P pipeline/build.py -- "$PWD/pipeline/bodies/${{ matrix.body }}.blend" "$PWD/sim.blend" \
            | grep -E "size|HPS|verts|sit drop|frame [0-9]*0 |snap|saved|Error|Traceback"
          test -s sim.blend
      - name: Export
        run: |
          X=""; [ "${{ matrix.name }}" = "m170-M" ] && X=proxy
          (while sleep 10; do free -m | awk 'NR==2{print "mem used",$3,"MB, free",$7,"MB"}'; done) & MEM=$!
          ~/blender/blender -b --factory-startup sim.blend -P pipeline/export.py -- "$PWD/out/${{ matrix.name }}" $X \
            | grep --line-buffered -E "FIT|bake|tee glb|exported|done|Error|Traceback"
          kill $MEM
          ls -la out/*
          test -s "out/${{ matrix.name }}/stand.glb"
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: "sim-${{ matrix.name }}", path: sim.blend, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with:
          name: fit-${{ matrix.name }}
          path: out
          retention-days: 7

  publish:
    needs: [textures, sim]
    if: always() && needs.textures.result == 'success' && needs.sim.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: got, pattern: fit-*, merge-multiple: false }
      - name: Place and commit
        run: |
          D=public/tee/fit; mkdir -p $D/tex
          cp got/fit-tex/* $D/tex/
          for a in got/fit-*/; do
            [ "$a" = "got/fit-tex/" ] && continue
            for v in "$a"*/; do n=$(basename "$v"); rm -rf "$D/$n"; mkdir -p "$D/$n"; cp "$v"* "$D/$n/"; done
          done
          python3 - <<'EOF'
          import json, glob, os
          D = "public/tee/fit"; idx = {}
          for f in sorted(glob.glob(f"{D}/*/fit.json")):
              idx[os.path.basename(os.path.dirname(f))] = json.load(open(f))
          json.dump(idx, open(f"{D}/index.json", "w"), indent=1); print(len(idx), "variants")
          EOF
          git config user.name "once-human"
          git config user.email "121476278+once-human@users.noreply.github.com"
          git add -A public/tee/fit
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Fit: $(ls -d $D/*/ | wc -l) body and size variants, three poses each"
          git pull --rebase -q && git push
