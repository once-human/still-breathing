# The places behind the person in the shop viewer (pipeline/stage.py: studio, window, show): one 360 degree picture
# each, rendered in Cycles in horizontal strips across the farm, then stitched, developed and committed to the site.
name: stage
on:
  workflow_dispatch:
    inputs:
      places:
        description: "places to render, comma separated (show; studio and window are photographs, pipeline/photo_place.py)"
        default: "show"
      width:
        description: "panorama width in pixels (height is half)"
        default: "4096"
      samples:
        description: "Cycles samples per pixel (adaptive, denoised)"
        default: "64"
      strips:
        description: "horizontal strips per place, one runner each"
        default: "16"
      publish:
        description: "commit to the site (false = preview: the developed picture is kept as a run artifact only)"
        default: "true"

permissions:
  contents: write

env:
  BLENDER: "5.3.0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          P=$(echo "${{ inputs.places }}" | tr -d ' ' | sed 's/[^,][^,]*/"&"/g')
          echo "matrix={\"place\":[$P],\"strip\":[$(seq -s, 0 $(( ${{ inputs.strips }} - 1 )))]}" >> "$GITHUB_OUTPUT"

  canopy:
    # the show's fabric canopy, simulated once as cloth (pipeline/canopy.py), shared with every strip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER }}
      - uses: actions/cache@v4
        id: cloth
        with:
          path: ~/.cache/stage
          key: canopy-${{ hashFiles('pipeline/canopy.py') }}
      - name: Blender ${{ env.BLENDER }}
        if: steps.cloth.outputs.cache-hit != 'true'
        run: |
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender
            curl -sSL "https://download.blender.org/release/Blender${BLENDER%.*}/blender-${BLENDER}-linux-x64.tar.xz" | tar -xJ -C ~/blender --strip-components=1
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 > /dev/null
      - name: Hang the canopy
        if: steps.cloth.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/stage
          ~/blender/blender -b --factory-startup -P pipeline/canopy.py -- ~/.cache/stage/canopy.npz | grep -E "band|saved|Error|Traceback"
      - run: mkdir -p cloth && cp ~/.cache/stage/canopy.npz cloth/
      - uses: actions/upload-artifact@v4
        with:
          name: canopy
          path: cloth/canopy.npz
          retention-days: 7

  strip:
    needs: [plan, canopy]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER }}
      - name: Blender ${{ env.BLENDER }}
        run: |
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender
            curl -sSL "https://download.blender.org/release/Blender${BLENDER%.*}/blender-${BLENDER}-linux-x64.tar.xz" | tar -xJ -C ~/blender --strip-components=1
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 > /dev/null
      - uses: actions/download-artifact@v4
        with: { name: canopy, path: cloth }
      - name: Render ${{ matrix.place }} strip ${{ matrix.strip }}
        run: |
          mkdir -p out; N=$(printf "${{ matrix.place }}-s%02d" ${{ matrix.strip }})
          CANOPY="$PWD/cloth/canopy.npz" ~/blender/blender -b --factory-startup -P pipeline/stage.py -- ${{ matrix.place }} "$PWD/out/$N.exr" ${{ matrix.strip }} ${{ inputs.strips }} ${{ inputs.samples }} ${{ inputs.width }} \
            | grep -E "Fra:.*Sample [0-9]+/[0-9]+$|saved|Error|Traceback" | tail -5
          test -s "out/$N.npy"
      - uses: actions/upload-artifact@v4
        with:
          name: strip-${{ matrix.place }}-${{ matrix.strip }}
          path: out/*.npy
          retention-days: 7

  publish:
    needs: strip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: got, pattern: strip-*, merge-multiple: true }
      - name: Develop and commit
        run: |
          pip install -q numpy pillow
          mkdir -p public/tee/stage
          for P in $(echo "${{ inputs.places }}" | tr ',' ' '); do
            python3 pipeline/stage_post.py "$P" "public/tee/stage/$P.webp" $(ls got/$P-s*.npy | sort)
          done
          ls -la public/tee/stage
          if [ "${{ inputs.publish }}" != "true" ]; then mkdir -p preview && for P in $(echo "${{ inputs.places }}" | tr "," " "); do cp "public/tee/stage/$P.webp" preview/; done; exit 0; fi
          git config user.name "once-human"
          git config user.email "121476278+once-human@users.noreply.github.com"
          git add public/tee/stage
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Stage: ${{ inputs.places }} around the person, 360 degrees, rendered on the farm"
          git pull --rebase -q && git push
      - uses: actions/upload-artifact@v4
        if: inputs.publish != 'true'
        with:
          name: preview
          path: preview/*.webp
          retention-days: 7
