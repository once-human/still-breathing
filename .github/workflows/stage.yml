# The places behind the person in the shop viewer (pipeline/stage.py: studio, window, show): one 360 degree picture
# each, rendered in Cycles in horizontal strips across the farm, then stitched, developed and committed to the site.
name: stage
on:
  workflow_dispatch:
    inputs:
      places:
        description: "places to render, comma separated (show; studio and window are photographs, pipeline/photo_place.py)"
        default: "show"
      width:
        description: "panorama width in pixels (height is half)"
        default: "4096"
      samples:
        description: "Cycles samples per pixel (adaptive, denoised)"
        default: "64"
      strips:
        description: "horizontal strips per place, one runner each"
        default: "16"
      publish:
        description: "commit to the site (false = preview: the developed picture is kept as a run artifact only)"
        default: "true"
      band:
        description: "true: the sharp band the viewer shows (16384 across, <place>-band.webp); width is then ignored"
        default: "false"
      photos:
        description: "photo places to make as bands too (pipeline/photo_place.py, 16k photos), comma separated: studio,window"
        default: ""
      motion:
        description: "true: the show's canopy breathing, its rows (sharp, as the band) rendered every frame of its loop and made into show-motion.mp4; strips = runners, frames shared out among them"
        default: "false"
      develop:
        description: "exposure,black point,glow start given (stage_post.py; the band takes the whole picture's, so they meet unseen); empty: measured"
        default: ""

permissions:
  contents: write

env:
  BLENDER: "5.3.0"
  MOTION_ROWS: "3368,3816"   # the rows of the 16384 x 8192 show the canopy moves in, as the viewer's camera sees it (scene.ts MOTION)
  MOTION_FRAMES: "120"       # canopy.py: a 10 s loop at 12 frames a second

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      photos: ${{ steps.m.outputs.photos }}
    steps:
      - id: m
        run: |
          P=$(echo "${{ inputs.places }}" | tr -d ' ' | sed 's/[^,][^,]*/"&"/g')
          echo "matrix={\"place\":[$P],\"strip\":[$(seq -s, 0 $(( ${{ inputs.strips }} - 1 )))]}" >> "$GITHUB_OUTPUT"
          Q=$(echo "${{ inputs.photos }}" | tr -d ' ' | sed 's/[^,][^,]*/"&"/g')
          echo "photos=[$Q]" >> "$GITHUB_OUTPUT"

  canopy:
    # the show's fabric canopy, simulated as moving cloth (pipeline/canopy.py), one band of it per runner, shared
    # with every strip
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix:
        band: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER }}
      - uses: actions/cache@v4
        id: cloth
        with:
          path: ~/.cache/stage
          key: canopy-${{ matrix.band }}-${{ hashFiles('pipeline/canopy.py') }}
      - name: Blender ${{ env.BLENDER }}
        if: steps.cloth.outputs.cache-hit != 'true'
        run: |
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender
            curl -sSL "https://download.blender.org/release/Blender${BLENDER%.*}/blender-${BLENDER}-linux-x64.tar.xz" | tar -xJ -C ~/blender --strip-components=1
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 > /dev/null
      - name: Hang band ${{ matrix.band }} of the canopy
        if: steps.cloth.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/stage
          BAND=${{ matrix.band }} ~/blender/blender -b --factory-startup -P pipeline/canopy.py -- ~/.cache/stage/band${{ matrix.band }}.npz | grep -E "band|saved|frame [0-9]*0 |Error|Traceback"
      - run: mkdir -p cloth && cp ~/.cache/stage/band${{ matrix.band }}.npz cloth/
      - uses: actions/upload-artifact@v4
        with:
          name: canopy-${{ matrix.band }}
          path: cloth/*.npz
          retention-days: 7

  strip:
    needs: [plan, canopy]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER }}
      - name: Blender ${{ env.BLENDER }}
        run: |
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender
            curl -sSL "https://download.blender.org/release/Blender${BLENDER%.*}/blender-${BLENDER}-linux-x64.tar.xz" | tar -xJ -C ~/blender --strip-components=1
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 > /dev/null
      - uses: actions/download-artifact@v4
        with: { pattern: canopy-*, path: cloth, merge-multiple: true }
      - name: Render ${{ matrix.place }} strip ${{ matrix.strip }}
        run: |
          mkdir -p out; N=$(printf "${{ matrix.place }}-s%02d" ${{ matrix.strip }})
          S=${{ matrix.strip }}; SS=${{ inputs.strips }}; WIDTH=${{ inputs.width }}
          if [ "${{ inputs.band }}" = "true" ]; then export ROWS=3368,5008 MASK=1; WIDTH=16384; fi
          if [ "${{ inputs.motion }}" = "true" ]; then
            # the canopy's rows, every frame of its loop: this runner's share of the frames, all the rows
            export ROWS=$MOTION_ROWS MASK=1; WIDTH=16384
            PER=$(( (MOTION_FRAMES + SS - 1) / SS )); A=$(( S * PER )); B=$(( A + PER - 1 )); [ $B -ge $MOTION_FRAMES ] && B=$(( MOTION_FRAMES - 1 ))
            [ $A -ge $MOTION_FRAMES ] && exit 0
            export FRAMES=$A-$B; S=0; SS=1
          fi
          CANOPY="$PWD/cloth" ~/blender/blender -b --factory-startup -P pipeline/stage.py -- ${{ matrix.place }} "$PWD/out/$N.exr" $S $SS ${{ inputs.samples }} $WIDTH \
            | grep -E "Fra:.*Sample [0-9]+/[0-9]+$|saved|mask|Error|Traceback" | tail -8
          ls out/*.npy
      - uses: actions/upload-artifact@v4
        with:
          name: strip-${{ matrix.place }}-${{ matrix.strip }}
          path: out/*.npy
          retention-days: 7

  photo:
    # the photo places' bands from Poly Haven's 16k photos (numpy; Blender only reads the .hdr)
    needs: plan
    if: inputs.photos != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        place: ${{ fromJson(needs.plan.outputs.photos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER }}
      - name: Blender ${{ env.BLENDER }}
        run: |
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender
            curl -sSL "https://download.blender.org/release/Blender${BLENDER%.*}/blender-${BLENDER}-linux-x64.tar.xz" | tar -xJ -C ~/blender --strip-components=1
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 > /dev/null
          pip install -q numpy pillow
      - name: Band of ${{ matrix.place }}
        run: |
          BLENDER=~/blender/blender ROWS=3368,5008 python3 pipeline/photo_place.py ${{ matrix.place }} 16384 | grep -v '^ *[\[\]{}"]' | tail -8
          mkdir -p photo && cp public/tee/stage/${{ matrix.place }}-band*.webp photo/ && ls -la photo
      - uses: actions/upload-artifact@v4
        with:
          name: photo-${{ matrix.place }}
          path: photo/*.webp
          retention-days: 7

  publish:
    needs: [strip, photo]
    # a photo place that failed leaves only its own band out
    if: always() && !cancelled() && needs.strip.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: got, pattern: strip-*, merge-multiple: true }
      - uses: actions/download-artifact@v4
        if: inputs.photos != ''
        continue-on-error: true
        with: { path: public/tee/stage, pattern: photo-*, merge-multiple: true }
      - name: Develop and commit
        run: |
          pip install -q numpy pillow
          IFS=, read -r EXPOSE BLACK HOT <<< "${{ inputs.develop }}"; export EXPOSE BLACK HOT
          mkdir -p public/tee/stage preview
          if [ "${{ inputs.band }}" = "true" ]; then export BAND=1; X=-band; else X=; fi
          if [ "${{ inputs.motion }}" = "true" ]; then
            # every frame developed as the band is (same exposure, people blurred), then made into the loop's video
            sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
            mkdir -p frames
            for F in $(seq 0 $(( MOTION_FRAMES - 1 ))); do
              G=$(printf "%03d" $F)
              BAND=1 ROWS=$MOTION_ROWS python3 pipeline/stage_post.py show "frames/f$G.png" $(ls got/show-s*-f$G.npy) | grep -E "people|saved"
            done
            python3 pipeline/motion_post.py frames public/tee/stage/show-motion.mp4
            cp frames/f000.png frames/f060.png preview/ ; X=-motion
          else
            for P in $(echo "${{ inputs.places }}" | tr ',' ' '); do
              ls got/$P-s??.npy > /dev/null 2>&1 || continue
              python3 pipeline/stage_post.py "$P" "public/tee/stage/$P$X.webp" $(ls got/$P-s??.npy | sort)
            done
          fi
          ls -la public/tee/stage
          if [ "${{ inputs.publish }}" != "true" ]; then cp public/tee/stage/*-band*.webp public/tee/stage/*.mp4 preview/ 2>/dev/null; for P in $(echo "${{ inputs.places }}" | tr "," " "); do cp "public/tee/stage/$P$X"*.webp preview/ 2>/dev/null; done; exit 0; fi
          git config user.name "once-human"
          git config user.email "121476278+once-human@users.noreply.github.com"
          git add public/tee/stage
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Stage: ${{ inputs.places }}$X around the person, rendered on the farm"
          git pull --rebase -q && git push
      - uses: actions/upload-artifact@v4
        if: inputs.publish != 'true'
        with:
          name: preview
          path: preview/*
          retention-days: 7
