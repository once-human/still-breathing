# The try-on's colour and ink maps (color-<d>-<tee>.jpg, orm-<d>-<tee>.png) for some shirts, without a cloth sim:
# run it when a print changes (a new front or back). fit.yml makes the same maps for every shirt as part of a fit.
name: tex
on:
  workflow_dispatch:
    inputs:
      tees:
        description: "design-colour pairs, comma separated"
        default: "E-black"

permissions:
  contents: write

jobs:
  tex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy pillow
      - name: Atlases and web maps
        working-directory: pipeline
        run: |
          for p in $(echo "${{ inputs.tees }}" | tr ',' ' '); do python3 texture.py ${p%-*} ${p#*-}; done
          for s in XS S M L XL 2XL; do SIZE=$s python3 texture.py detail; done
          mkdir -p ../tex && python3 webtex.py ../tex "${{ inputs.tees }}"
          for p in $(echo "${{ inputs.tees }}" | tr ',' ' '); do d=$(echo ${p%-*} | tr A-Z a-z); t=${p#*-}
            cp ../tex/color-$d-$t.jpg ../tex/orm-$d-$t.png ../public/tee/fit/tex/; done
      - name: Commit
        run: |
          git config user.name "once-human"
          git config user.email "121476278+once-human@users.noreply.github.com"
          git add public/tee/fit/tex
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Try-on maps: ${{ inputs.tees }}"
          git reset -q --hard HEAD   # the atlases and detail maps the run wrote are not to be kept
          for i in 1 2 3 4 5; do git pull --rebase -q -X theirs && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i * 7)); done; exit 1
